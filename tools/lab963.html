lab.OFF = { x: 0.195, y: 0.05 };

lab.roleOf = function (p) {

lab.build = function (cells) {

lab.showBaked = function (colors) {
  while (root.children.length) { var o = root.children.pop(); o.geometry.dispose(); }

    var b = lab.baked[r], g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(b.pos, 3)); g.setAttribute('normal', new T.BufferAttribute(b.nor, 3)); g.setIndex(new T.BufferAttribute(b.idx, 1));

// ---- finding the wheels automatically: a tyre is a fat disc standing at the side of the car, about 0.6-0.85 m across ----

  var found = [];

    var b = lab.bounds(p), dx = b[3] - b[0], dy = b[4] - b[1], dz = b[5] - b[2];

lab.cam = function (px, py, pz, lx, ly, lz) { cam.position.set(px, py, pz); cam.lookAt(lx, ly, lz); renderer.render(scene, cam); };
